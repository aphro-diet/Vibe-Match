<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to VibeMatch</h1>
            <p>Find the perfect songs and mood for your Instagram stories!</p>
        </header>
        
        <section class="mood-section">
            <h2>Pick a Mood</h2>
            <div class="mood-buttons">
                <button onclick="showRecommendations('happy')">Happy</button>
                <button onclick="showRecommendations('sad')">Sad</button>
                <button onclick="showRecommendations('birthday')">Birthday</button>
                <button onclick="showRecommendations('picnic')">Picnic</button>
                <button onclick="showRecommendations('aesthetic')">Aesthetic</button>
                <button onclick="showRecommendations('desi')">Desi</button>
                <button onclick="getRandomVibe()">Get My Vibe</button>
            </div>
        </section>

        <section id="recommendations">
            <h2>Your Recommendations</h2>
            <div id="song-recommendations">
                <!-- Song recommendations will be shown here -->
            </div>
        </section>

        <footer>
            <p>&copy; 2025 VibeMatch. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
