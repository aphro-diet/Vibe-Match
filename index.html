<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeMatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>VibeMatch</h1>
        <p>Find your perfect song and mood for your Instagram story!</p>
    </header>

    <!-- Background video -->
    <div class="background-video">
        <video autoplay muted loop id="background-video">
            <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Mood Selection -->
    <div class="mood-selection">
        <label for="mood">Select Mood:</label>
        <select id="mood">
            <option value="birthday">Birthday</option>
            <option value="sad">Sad</option>
            <option value="happy">Happy</option>
            <option value="energetic">Energetic</option>
            <option value="romantic">Romantic</option>
            <option value="relaxed">Relaxed</option>
            <option value="friends">Friends</option>
            <option value="aesthetic">Aesthetic</option>
            <option value="adventure">Adventure</option>
            <option value="chill">Chill</option>
        </select>
        <button onclick="generateRecommendations()">Get Recommendations</button>
    </div>

    <!-- GIFs for fun -->
    <div class="fun-gifs">
        <img src="https://media.giphy.com/media/1mDazMc60ee9W/giphy.gif" alt="fun-gif">
        <img src="https://media.giphy.com/media/xUOxf3cUXYbbM/hop.gif" alt="fun-gif">
    </div>

    <div id="recommendations" class="recommendations">
        <!-- Recommendations will appear here -->
    </div>

    <footer>
        <p>VibeMatch - Music and Mood for Your Story</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
