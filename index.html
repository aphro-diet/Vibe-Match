<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibe-Matcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Vibe-Matcher</h1>
  </header>

  <div class="container">
    <section class="upload">
      <h2>Upload Your Image</h2>
      <input type="file" id="imageInput" accept="image/*">
      <p>Choose an image that reflects your current vibe.</p>
    </section>

    <section class="vibe-selection">
      <h2>Select a Vibe</h2>
      <button onclick="generateVibe('Happy')">Happy</button>
      <button onclick="generateVibe('Sad')">Sad</button>
      <button onclick="generateVibe('Friends')">Friends</button>
      <button onclick="generateVibe('Aesthetic')">Aesthetic</button>
      <button onclick="generateVibe('Romantic')">Romantic</button>
      <button onclick="generateVibe('Dark')">Dark</button>
      <button onclick="generateVibe('Calm')">Calm</button>
    </section>

    <section class="board" id="vibeBoard"></section>
  </div>

  <script src="script.js"></script>
</body>
</html>
